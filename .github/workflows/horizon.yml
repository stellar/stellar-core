name: Horizon Integration Tests

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Test against core's next protocol (docker/Dockerfile.testing enables it) so
  # a protocol bump doesn't require updating this file. Expect failures until
  # the protocol-next branches support it.
  protocol:
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/util/ProtocolVersion.h
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          version=$(sed -nE 's/.*MAX_SUPPORTED_PROTOCOL_VERSION[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' src/util/ProtocolVersion.h)
          test -n "$version"
          echo "version=$((version + 1))" >> "$GITHUB_OUTPUT"

  horizon:
    needs: protocol
    uses: stellar/stellar-horizon/.github/workflows/integration-tests.yml@2c53fd1b5e3217ca464e3b57902aadc12af47c36
    with:
      horizon_git_ref: protocol-next
      core_git_ref: ${{ github.sha }}
      protocol_version: ${{ needs.protocol.outputs.version }}
      # Empty skips Horizon's stellar-rpc tests: no released RPC supports the
      # next protocol.
      stellar_rpc_docker_img: ''
