name: Overlay min version

# Once pubnet has upgraded to a new ledger protocol, opens a PR raising
# OVERLAY_PROTOCOL_MIN_VERSION to the lowest overlay version of the releases
# that support that protocol (see scripts/check-overlay-min-version.sh).

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump-overlay-min-version:
    if: github.repository == 'stellar/stellar-core'
    runs-on: ubuntu-24.04
    env:
      BRANCH: bot/bump-overlay-min-version
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get pubnet ledger protocol version
      id: pubnet
      run: |
        PROTOCOL=$(curl -sSf --retry 3 https://horizon.stellar.org/ | jq -er '.current_protocol_version | numbers')
        echo "Pubnet is on protocol $PROTOCOL"
        echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"

    - name: Raise OVERLAY_PROTOCOL_MIN_VERSION if possible
      env:
        PROTOCOL: ${{ steps.pubnet.outputs.protocol }}
      run: |
        set -o pipefail
        ./scripts/check-overlay-min-version.sh --apply "$PROTOCOL" | tee "$RUNNER_TEMP/check.txt"

    - name: Open or update PR
      env:
        GH_TOKEN: ${{ github.token }}
        PROTOCOL: ${{ steps.pubnet.outputs.protocol }}
        BASE: ${{ github.ref_name }}
      run: |
        if git diff --quiet
        then
          echo "OVERLAY_PROTOCOL_MIN_VERSION is up to date"
          exit 0
        fi
        MIN=$(sed -n 's/^[[:space:]]*OVERLAY_PROTOCOL_MIN_VERSION[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' src/main/Config.cpp)

        # Leave an open PR alone if it already makes the same change.
        OPEN_PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number')
        if [ -n "$OPEN_PR" ] &&
           git fetch --depth=1 origin "$BRANCH" 2>/dev/null &&
           git diff --quiet FETCH_HEAD -- src/main/Config.cpp
        then
          echo "$BRANCH already raises OVERLAY_PROTOCOL_MIN_VERSION to $MIN"
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git checkout -B "$BRANCH"
        git commit -qam "Bump OVERLAY_PROTOCOL_MIN_VERSION to $MIN" \
          -m "Pubnet is on protocol $PROTOCOL, and no release supporting it has an overlay version below $MIN."
        git push -f origin "$BRANCH"

        BODY="$RUNNER_TEMP/body.md"
        {
          echo "Pubnet is on protocol $PROTOCOL, and no release supporting it has an overlay version below $MIN, so this raises \`OVERLAY_PROTOCOL_MIN_VERSION\` to $MIN. Opened by the \`${{ github.workflow }}\` workflow."
          echo
          echo "**Reviewer:** before merging, verify that pubnet is on protocol $PROTOCOL and that every release supporting it, including any not tagged in this repo, has \`OVERLAY_PROTOCOL_VERSION\` of at least $MIN. Nodes below $MIN will be disconnected."
          echo
          echo '```'
          cat "$RUNNER_TEMP/check.txt"
          echo '```'
        } > "$BODY"
        if [ -z "$OPEN_PR" ]
        then
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Bump OVERLAY_PROTOCOL_MIN_VERSION to $MIN" --body-file "$BODY"
        else
          gh pr edit "$OPEN_PR" \
            --title "Bump OVERLAY_PROTOCOL_MIN_VERSION to $MIN" --body-file "$BODY"
        fi
