[workspace]
resolver = "2"
members = ["src/rust", "overlay"]
exclude = ["overlay-stub", "overlay/vendor/*"]

# Preserve QUIC stream priority through libp2p's stream wrappers. These are the
# already-pinned releases with a small API bridge; see overlay/vendor/README.md.
[patch.crates-io]
libp2p-core = { path = "overlay/vendor/libp2p-core" }
libp2p-swarm = { path = "overlay/vendor/libp2p-swarm" }
libp2p-quic = { path = "overlay/vendor/libp2p-quic" }
multistream-select = { path = "overlay/vendor/multistream-select" }

[profile.release]
codegen-units = 1
lto = true
# Note: setting debug=true here is only going to cause debuginfo to be
# generated for polymorphic functions inlined from sub-crates and/or
# functions defined in the top-level rust crate, not the soroban sub
# crates. They need to have debug=true set in their Cargo.toml files
# (or you can build with `make RUST_PROFILE=dev` to get them built with
# debug-and-no-opt).
debug = true

[profile.fastdev]
inherits = "release"
lto = "off"
debug = "line-tables-only"
codegen-units = 16
split-debuginfo = "unpacked"
